# Sample workflow: scan every pull request, fail only on NEW actionable findings, upload SARIF
# to GitHub code scanning and put the Markdown summary on the job page.
#
# Copy to .github/workflows/security-triage.yml. Optional: add an ANTHROPIC_API_KEY repository
# secret to turn on LLM enrichment; without it the deterministic heuristics are used.
#
# Actions are pinned to commit SHAs (the tag is in the comment), and scanner versions are pinned
# below, so a re-run uses the same tools.
name: security-triage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # upload SARIF

env:
  SEMGREP_VERSION: "1.99.0"
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_VERSION: "0.76.1"

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install triage and scanners
        run: |
          # Not on PyPI yet: install from a pinned commit of the repository.
          pip install "findings-triage[llm] @ git+https://github.com/OWNER/findings-triage@COMMIT_SHA" \
            "semgrep==${SEMGREP_VERSION}"
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C bin gitleaks
          base=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}
          curl -fsSLO "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "trivy_${TRIVY_VERSION}_checksums.txt"
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # LLM verdicts are cached by fingerprint + prompt version, so unchanged findings cost
      # nothing on the next run and a report can be reproduced exactly from the cache.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .triage/cache
          key: triage-cache-${{ github.run_id }}
          restore-keys: triage-cache-

      - name: Scan the base commit (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          triage scan "$RUNNER_TEMP/base" --out .triage/base.json --reports-dir .triage/raw-base

      - name: Scan this commit
        run: triage scan . --out .triage/run.json

      - name: Triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          args=(--out-dir .triage/report --fail-on high --audit-log .triage/audit.jsonl)
          if [ -f triage.suppressions.yaml ]; then args+=(--suppressions triage.suppressions.yaml); fi
          if [ "$IS_PR" = "true" ]; then args+=(--baseline .triage/base.json --new-only); fi
          set +e
          triage report .triage/run.json "${args[@]}"
          status=$?
          set -e
          cat .triage/report/report.md >> "$GITHUB_STEP_SUMMARY"
          triage verify-log .triage/audit.jsonl
          exit $status

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('.triage/report/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          sarif_file: .triage/report/report.sarif
          category: findings-triage

      - name: Keep the report, run file and audit log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-triage
          path: |
            .triage/run.json
            .triage/report/
            .triage/audit.jsonl
          retention-days: 90
